[project]
name = "inventory-segmenter-mcp"
version = "0.1.0"
description = "MCP server that classifies a company data inventory into seven buckets via an LLM API (Anthropic or OpenAI)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "pymupdf>=1.24",
    "tiktoken>=0.5.0",
    "google-api-python-client>=2.160.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
include = [
    "server.py",
    "llm_provider.py",
    "segmenter.py",
    "excel_io.py",
    "prompt.py",
    "env_loader.py",
    "gdrive/__init__.py",
    "gdrive/credentials.py",
    "gdrive/scan.py",
    "gdrive/fetch.py",
    "gdrive/pipeline_build.py",
]
